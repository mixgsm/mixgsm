name: QA (testler + yayin oncesi kontroller)

# main'e her push'ta ve PR'larda calisir. Hata varsa is kirmizi olur.
# NOT: GitHub Pages "branch'ten yayin" modunda oldugu icin bu kontrol yayini
# kendiliginden durduramaz; PR + branch korumasi (zorunlu status check) ile
# birlikte kullanildiginda bozuk surum main'e hic giremez.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (SHA ile sabitlendi)
        with:
          # QA yalnizca okur; GITHUB_TOKEN'in .git/config'te kalmasina gerek yok.
          persist-credentials: false

      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (SHA ile sabitlendi)
        with:
          node-version: "20"

      - name: Birim testleri
        run: npm test

      - name: Yayin oncesi QA (HTML, JS, CSP, linkler, veri, gorseller)
        run: npm run qa
