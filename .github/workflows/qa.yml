name: QA (testler + yayin oncesi kontroller)

# main'e her push'ta ve PR'larda calisir. Hata varsa is kirmizi olur.
# NOT: GitHub Pages "branch'ten yayin" modunda oldugu icin bu kontrol yayini
# kendiliginden durduramaz; PR + branch korumasi (zorunlu status check) ile
# birlikte kullanildiginda bozuk surum main'e hic giremez.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Depoyu al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Node.js kur
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Birim testleri
        run: npm test

      - name: Yayin oncesi QA (HTML, JS, CSP, linkler, veri, gorseller)
        run: npm run qa
