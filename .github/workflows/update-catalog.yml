name: Katalog Guncelle (Google Sheets -> catalog.json + catalog-laptop.json)

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-catalog.yml"
      - "scripts/generate-catalog.js"
      - "scripts/generate-catalog-laptop.js"
      - "scripts/generate-price-page.js"
      - "scripts/generate-price-assets.js"
      - "scripts/check-images.js"
      - "scripts/asset-version.js"
      - "scripts/generate-sitemap.js"
      - "scripts/generate-photo-list.js"
      - "scripts/generate-product-pages.js"
      - "scripts/generate-hero-preload.js"
      - "scripts/indexnow-submit.js"
      # Taksit kurali / ozellik yazimi site kodundan okunur; sayac anahtari
      # index.html'den. Bunlar degisince urun sayfalari hemen yenilensin.
      - "js/**"
      - "index.html"
      # Yeni telefon/laptop fotografi yuklenince liste ve laptop katalogu
      # (otomatik fotograf) hemen yenilensin (20 dk beklemeden).
      - "photos/**"
      - "laptop-photos/**"
      - "scripts/lib/**"
      - "scripts/tests/**"
      - "package.json"

permissions:
  contents: write
  actions: write # son adimda deploy-pages.yml'yi baslatmak icin

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update-catalog:
    # Sabit surum: "ubuntu-latest" 19 Ekim 2026'dan itibaren Ubuntu 26'ya geciyor;
    # Playwright'in sistem bagimliliklari yeni surumde hazir olmayabilir.
    runs-on: ubuntu-24.04
    steps:
      - name: Depoyu al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Her zaman main'in EN SON halini al. Eski bir calismayi "Re-run"
          # etmek bile eski commit yerine guncel main uzerinde calisir.
          ref: main

      - name: Node.js kur
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      # Dogrulama kurallarinin kendisi bozuksa hicbir sey uretilmez/commit edilmez.
      # Yalnizca VERI testleri: HTML/tasarim kaynakli bir QA hatasi fiyat
      # guncellemelerini dondurmasin (tam QA: .github/workflows/qa.yml).
      - name: Katalog dogrulama testleri
        run: node --test scripts/tests/catalog-schema.test.js scripts/tests/check-images.test.js scripts/tests/sitemap.test.js scripts/tests/sheet-selection.test.js scripts/tests/tsv.test.js

      - name: catalog.json olustur (Google Sheets'ten - TELEFON)
        run: node scripts/generate-catalog.js

      # FAZ 3: Laptop uretimi TELEFON adimindan TAMAMEN BAGIMSIZ bir adim.
      # generate-catalog-laptop.js kendi icinde hicbir zaman hata firlatip
      # process'i basarisiz koda cikarmiyor (placeholder/hata durumunda
      # bos-ama-gecerli dosya yaziyor), ama ekstra guvenlik katmani olarak
      # continue-on-error: true de eklendi - bu adim ne olursa olsun
      # asagidaki adimlari ve TELEFON'un catalog.json'i ASLA etkilenmez.
      - name: catalog-laptop.json olustur (Public Laptop Sheet'ten - LAPTOP)
        continue-on-error: true
        run: node scripts/generate-catalog-laptop.js

      - name: Fiyat sayfasi ve ortak besleme olustur (catalog.json -> fiyat-listesi/, feed/products.json)
        # continue-on-error YOK: uretilemezse is akisi HATA verir; catalog.json ile fiyat sayfasi tutarsiz commit edilmez.
        run: node scripts/generate-price-page.js

      - name: Katalog, besleme ve fiyat sayfasi tutarliligini dogrula
        run: node scripts/generate-price-page.js --verify

      # Urun sayfalari (urun/<slug>/, laptop/<slug>/): Google'da urun bazinda
      # gorunurluk. Once tumu bellekte uretilir; hata olursa hicbir dosya
      # degismez ve katalog commit'i ENGELLENMEZ.
      - name: Urun sayfalari olustur (urun/, laptop/)
        continue-on-error: true
        run: node scripts/generate-product-pages.js

      # Acilis (hero) urun fotografi index.html'e onceden yazilir (hiz/LCP).
      # Uretilemezse site eski davranisla (JS ile) calismaya devam eder.
      - name: Acilis gorselini index.html'e yaz
        continue-on-error: true
        run: node scripts/generate-hero-preload.js

      # sitemap.xml lastmod = katalog gunu; uretilemezse yayin engellenmez.
      - name: sitemap.xml guncelle
        continue-on-error: true
        run: node scripts/generate-sitemap.js

      # Telefon fotograf listesi (site galeri/eslestirme icin okur). Uretilemezse
      # site sabit liste + GitHub API yedegiyle calismaya devam eder.
      - name: feed/photos.json guncelle
        continue-on-error: true
        run: node scripts/generate-photo-list.js

      # Gorsel saglik raporu: eksik/kirik gorselleri Actions ozetinde UYARI
      # olarak gosterir; yayini engellemez (site kirik gorselde yedek gosterir).
      - name: Gorsel saglik kontrolu
        continue-on-error: true
        run: node scripts/check-images.js

      # FAZ 4: WhatsApp/Instagram'da paylasilan mobil fiyat listesi (JPG
      # sayfalari + tiklanabilir linkli PDF). catalog.json'i bir "mini
      # tarayici" (Playwright/Chromium) ile goruntuye/PDF'e ceviriyor, bu
      # yuzden TELEFON/LAPTOP/fiyat sayfasi adimlarindan TAMAMEN BAGIMSIZ
      # ve continue-on-error: true - bu adimlardan biri (bagimlilik kurulumu,
      # tarayici indirme, render) basarisiz olsa bile TELEFON kataloğunun
      # commit'i ASLA etkilenmez (laptop adimiyla ayni izolasyon deseni).
      - name: Fiyat listesi gorselleri icin bagimliliklari kur (Playwright)
        continue-on-error: true
        run: npm ci

      - name: Playwright Chromium kur
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Mobil fiyat listesi JPG + PDF olustur (catalog.json'dan)
        continue-on-error: true
        run: node scripts/generate-price-assets.js

      - name: Degisiklik varsa commit + push et
        id: commit
        run: |
          git add catalog.json catalog-laptop.json feed/products.json fiyat-listesi/index.html sitemap.xml
          git add index.html
          if [ -f llms.txt ]; then git add llms.txt; fi
          if [ -f feed/photos.json ]; then
            git add feed/photos.json
          fi
          # Google Merchant yerel listeleme beslemeleri (generate-product-pages.js)
          for f in feed/google-urunler.tsv feed/google-magaza-stok.tsv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          # price-assets AYRI ve GUVENLI eklenir: yukaridaki FAZ 4 adimlari
          # (continue-on-error) herhangi bir nedenle calisip price-assets/
          # klasorunu hic olusturamamis olabilir. "git add price-assets"
          # boyle bir durumda dogrudan (yukaridaki satirla BIRLIKTE)
          # cagrilirsa, olmayan bir pathspec icin git HATA VERIR ve script
          # -eo pipefail nedeniyle orada durur - bu da TELEFON/LAPTOP/fiyat
          # sayfasi degisikliklerinin bile commit'lenmesini ENGELLER. Bu
          # yuzden once yukarida ayri eklenir, price-assets ise SADECE
          # klasor gercekten varsa, ayri bir adimda eklenir.
          if [ -d price-assets ]; then
            git add price-assets
          fi
          # Urun sayfalari: -A ile katalogdan kalkan urunun sayfasinin silinmesi de commit'lenir.
          for d in urun laptop rehber; do
            if [ -d "$d" ] || git ls-files --error-unmatch "$d" >/dev/null 2>&1; then
              git add -A "$d"
            fi
          done
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atilmiyor."
          else
            # IndexNow (Bing) icin degisen dosyalarin listesi
            git diff --cached --name-only > "$RUNNER_TEMP/degisen-dosyalar.txt"
            git config user.name "mixgsm-catalog-bot"
            git config user.email "actions@github.com"
            git commit -m "chore: catalog.json / catalog-laptop.json / fiyat listesi gorselleri otomatik guncellendi"
            # Bu sirada main'e baska bir commit gelmis olabilir (or. elle yukleme).
            # Gondermeden once en son main'in ustune al; zorla gonderme (force) YOK.
            for deneme in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "pushed=1" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Gonderme basarisiz (deneme $deneme), tekrar denenecek..."
              sleep 10
            done
            echo "::error::Katalog commit'i main'e gonderilemedi (3 deneme)."
            exit 1
          fi

      # Degisen sayfalari Bing/IndexNow'a bildir (ChatGPT aramasi Bing'e dayanir).
      # Yayini asla engellemez.
      - name: Degisen sayfalari IndexNow'a bildir (Bing)
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        run: node scripts/indexnow-submit.js "$RUNNER_TEMP/degisen-dosyalar.txt"

      # Bot commit'i (GITHUB_TOKEN) "push" ile baska is tetiklemez, workflow_run da
      # bu depoda tetiklenmedi; yayin isi burada acikca baslatilir (QA orada calisir).
      - name: Yayin isini baslat (deploy-pages.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "${{ github.repository }}" --ref main
