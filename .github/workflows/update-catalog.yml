name: Katalog Guncelle (Google Sheets -> catalog.json + catalog-laptop.json)

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-catalog.yml"
      - "scripts/generate-catalog.js"
      - "scripts/generate-catalog-laptop.js"
      - "scripts/generate-price-page.js"
      - "scripts/generate-price-assets.js"
      - "package.json"

permissions:
  contents: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: catalog.json olustur (Google Sheets'ten - TELEFON)
        run: node scripts/generate-catalog.js

      # FAZ 3: Laptop uretimi TELEFON adimindan TAMAMEN BAGIMSIZ bir adim.
      # generate-catalog-laptop.js kendi icinde hicbir zaman hata firlatip
      # process'i basarisiz koda cikarmiyor (placeholder/hata durumunda
      # bos-ama-gecerli dosya yaziyor), ama ekstra guvenlik katmani olarak
      # continue-on-error: true de eklendi - bu adim ne olursa olsun
      # asagidaki adimlari ve TELEFON'un catalog.json'i ASLA etkilenmez.
      - name: catalog-laptop.json olustur (Public Laptop Sheet'ten - LAPTOP)
        continue-on-error: true
        run: node scripts/generate-catalog-laptop.js

      - name: Fiyat sayfasi ve ortak besleme olustur (catalog.json -> fiyat-listesi/, feed/products.json)
        # continue-on-error YOK: uretilemezse is akisi HATA verir; catalog.json ile fiyat sayfasi tutarsiz commit edilmez.
        run: node scripts/generate-price-page.js

      - name: Katalog, besleme ve fiyat sayfasi tutarliligini dogrula
        run: node scripts/generate-price-page.js --verify

      # FAZ 4: WhatsApp/Instagram'da paylasilan mobil fiyat listesi (JPG
      # sayfalari + tiklanabilir linkli PDF). catalog.json'i bir "mini
      # tarayici" (Playwright/Chromium) ile goruntuye/PDF'e ceviriyor, bu
      # yuzden TELEFON/LAPTOP/fiyat sayfasi adimlarindan TAMAMEN BAGIMSIZ
      # ve continue-on-error: true - bu adimlardan biri (bagimlilik kurulumu,
      # tarayici indirme, render) basarisiz olsa bile TELEFON kataloğunun
      # commit'i ASLA etkilenmez (laptop adimiyla ayni izolasyon deseni).
      - name: Fiyat listesi gorselleri icin bagimliliklari kur (Playwright)
        continue-on-error: true
        run: npm install

      - name: Playwright Chromium kur
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Mobil fiyat listesi JPG + PDF olustur (catalog.json'dan)
        continue-on-error: true
        run: node scripts/generate-price-assets.js

      - name: Degisiklik varsa commit + push et
        run: |
          git add catalog.json catalog-laptop.json feed/products.json fiyat-listesi/index.html
          # price-assets AYRI ve GUVENLI eklenir: yukaridaki FAZ 4 adimlari
          # (continue-on-error) herhangi bir nedenle calisip price-assets/
          # klasorunu hic olusturamamis olabilir. "git add price-assets"
          # boyle bir durumda dogrudan (yukaridaki satirla BIRLIKTE)
          # cagrilirsa, olmayan bir pathspec icin git HATA VERIR ve script
          # -eo pipefail nedeniyle orada durur - bu da TELEFON/LAPTOP/fiyat
          # sayfasi degisikliklerinin bile commit'lenmesini ENGELLER. Bu
          # yuzden once yukarida ayri eklenir, price-assets ise SADECE
          # klasor gercekten varsa, ayri bir adimda eklenir.
          if [ -d price-assets ]; then
            git add price-assets
          fi
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atilmiyor."
          else
            git config user.name "mixgsm-catalog-bot"
            git config user.email "actions@github.com"
            git commit -m "chore: catalog.json / catalog-laptop.json / fiyat listesi gorselleri otomatik guncellendi"
            git push
          fi
