name: Yayinla (QA gecerse GitHub Pages)

# NEDEN: Pages "branch'ten yayin" modunda QA kirmiziyken bile site guncelleniyordu.
# Bu is once testleri + QA'yi (qa.yml) calistirir, yalniz gecerse siteyi yayinlar.
# Bot commit'leri (GITHUB_TOKEN) "push" ile baska is tetiklemez; bu yuzden katalog
# isi (update-catalog.yml) son adiminda bu isi "gh workflow run" ile baslatir.
#
# ACIL DURUM (kontrol takildi, fiyat hemen yayinlanmali):
#   GitHub -> Actions -> "Yayinla (QA gecerse GitHub Pages)" -> Run workflow ->
#   "ACIL: kontrolleri atla" kutusunu isaretle -> yesil "Run workflow".
#
# ESKI DUZENE DONUS (main'den dogrudan yayin):
#   Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch",
#   Branch: main, klasor: / (root) -> Save. Bu is o zaman yayin adimini
#   kendiliginden atlar ("Pages modu" adimi); dosyayi silmek gerekmez.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      kontrolleri_atla:
        description: "ACIL: kontrolleri atla ve dogrudan yayinla"
        type: boolean
        default: false

permissions:
  contents: read

# Ayni anda tek yayin; bekleyenlerden yalniz en yenisi calisir.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  qa:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.kontrolleri_atla) }}
    uses: ./.github/workflows/qa.yml

  # Derleme ve yayin AYRI isler (GitHub'in onerdigi duzen). Ayni iste paket yuklenip
  # 0,2 sn sonra yayin adimi paketi aradiginda GitHub'in paket listesi henuz
  # guncellenmemis olabiliyor ("No artifacts named github-pages were found",
  # 25.11.2026'da arka arkaya goruldu). Ayri iste bu yaris olmaz; "Re-run" da
  # ayni calismada ikinci paket birakip "Multiple artifacts" hatasina dusmez.
  build:
    needs: qa
    if: ${{ always() && (needs.qa.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.kontrolleri_atla)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      mode: ${{ steps.mode.outputs.type }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pages modu
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)" >> "$GITHUB_OUTPUT"

      # Eski (legacy) yayinla ayni cikti: site bugun de Jekyll'den geciyor.
      - name: Siteyi derle (Jekyll)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - name: Yayin paketini yukle
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5

      - name: Yayin atlandi bilgisi
        if: steps.mode.outputs.type != 'workflow'
        run: echo "::notice::Pages kaynagi '${{ steps.mode.outputs.type }}' (GitHub Actions degil); kontroller gecti, yayin adimi atlandi."

  deploy:
    needs: build
    if: ${{ always() && needs.build.result == 'success' && needs.build.outputs.mode == 'workflow' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Yayinla
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
